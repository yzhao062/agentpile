[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpile"
version = "0.0.1.dev0"
description = "Load public agent-trajectory datasets and agent traces into one run record based on ATIF v1.7."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yue Zhao" }]
keywords = ["agent", "trajectory", "trace", "dataset", "atif", "opentelemetry"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The core reads ATIF, OTLP JSON and agentpile config files with the standard
# library alone (gate 6). Everything that talks to a hub or a framework is an extra.
dependencies = []

[project.optional-dependencies]
hf = ["huggingface_hub>=0.23", "pyarrow>=14"]
# Lower bounds are the versions the capture tests ran against (2026-10-20); nothing older is tested.
# pydantic-ai-slim needs Python 3.11, openai-agents and the OpenInference instrumentor need 3.10.
otel = ["opentelemetry-sdk>=1.45.1; python_version >= '3.10'"]
pydantic-ai = ["pydantic-ai-slim>=2.58.0; python_version >= '3.11'", "opentelemetry-sdk>=1.45.1; python_version >= '3.10'"]
openai-agents = [
  "openai-agents>=0.24.0; python_version >= '3.10'",
  "openinference-instrumentation-openai-agents>=2.5.3; python_version >= '3.10'",
  "opentelemetry-sdk>=1.45.1; python_version >= '3.10'",
]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/yzhao062/agentpile"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentpile = ["schemas/*.json", "corpora/manifests/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: reads real dataset files (downloads them unless AGENTPILE_DATA points at a local copy)",
  "grade: compares with GRADE's expected step graphs (needs AGENTPILE_GRADE_EXPECTED)",
]
addopts = "-m 'not network'"
