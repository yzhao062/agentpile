[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpile"
version = "0.2.0.dev0"
description = "Load public agent-trajectory datasets and agent traces into one run record based on ATIF v1.7."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Yue Zhao", email = "yzhao010@usc.edu" }]
keywords = ["agent", "trajectory", "trace", "dataset", "atif", "opentelemetry"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The core reads ATIF, OTLP JSON and agentpile config files with the standard
# library alone (gate 6). Everything that talks to a hub or a framework is an extra.
dependencies = []

[project.optional-dependencies]
hf = ["huggingface_hub>=0.23", "pyarrow>=14"]
view = ["rich>=13"]
pandas = ["pandas>=1.5"]
graph = ["networkx>=3.0"]
# Lower bounds are versions the tests ran against: the frameworks as of 2026-10-20, and OpenTelemetry 1.42.1
# (Google Colab's version in 2026-10, where google-adk caps it) as well as 1.45.1. Nothing older is tested.
# pydantic-ai-slim needs Python 3.11, openai-agents and the OpenInference instrumentor need 3.10.
# otel is opentelemetry-proto alone, which lets ap.send_otlp reach a receiver that takes only protobuf
# (Arize Phoenix); the OpenTelemetry SDK comes with the capture extras, the only code that uses it.
otel = ["opentelemetry-proto>=1.42.1; python_version >= '3.10'"]
pydantic-ai = ["pydantic-ai-slim>=2.58.0; python_version >= '3.11'", "opentelemetry-sdk>=1.42.1; python_version >= '3.10'"]
openai-agents = [
  "openai-agents>=0.24.0; python_version >= '3.10'",
  "openinference-instrumentation-openai-agents>=2.5.3; python_version >= '3.10'",
  "opentelemetry-sdk>=1.42.1; python_version >= '3.10'",
]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/yzhao062/agentpile"
Repository = "https://github.com/yzhao062/agentpile"
Issues = "https://github.com/yzhao062/agentpile/issues"
Changelog = "https://github.com/yzhao062/agentpile/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentpile = ["schemas/*.json", "corpora/manifests/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: reads real dataset files (downloads them unless AGENTPILE_DATA points at a local copy)",
  "grade: compares with GRADE's expected step graphs (needs AGENTPILE_GRADE_EXPECTED)",
]
addopts = "-m 'not network'"
